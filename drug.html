<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mbire RDC - Drug Distribution System</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:Arial;max-width:800px;margin:auto;padding:15px;background:#f2f2f2}
h2,h3{text-align:center}
.card{background:white;padding:15px;border-radius:10px;margin:10px 0}
button{padding:10px 15px;margin:5px;border:none;border-radius:8px;background:#0b6b3a;color:white;font-weight:bold;cursor:pointer}
button.grey{background:#555}
input,select{width:100%;padding:10px;margin:5px 0;border:1px solid #ccc;border-radius:8px;box-sizing:border-box}
table{width:100%;border-collapse:collapse;background:white}
th,td{border:1px solid #ddd;padding:8px;text-align:left;font-size:13px}
.hidden{display:none}
</style>
</head>
<body>

<h2>Welcome To Mbire RDC</h2>
<h3>Drug Distribution System</h3>
<p style="text-align:center">Select your option</p>

<!-- MAIN MENU -->
<div class="card" id="menu">
<button onclick="showEnter()">Enter Data</button>
<button onclick="showView()">View Transaction</button>
<button onclick="showSummary()">Summarised Data</button>
</div>

<!-- ENTER DATA -->
<div class="card hidden" id="enterBox">
<h3>Enter Data - Select Option</h3>
<button onclick="selectType(1)">1 - Natpharm to Clinics</button>
<button onclick="selectType(2)">2 - Chitsungo to Clinics</button>
<button onclick="selectType(3)">3 - Natpharm to Chitsungo</button>
<button onclick="selectType(4)">4 - Clinic to Clinic</button>
<p id="selectedType" style="font-weight:bold;color:#0b6b3a"></p>

<div id="formBox" class="hidden">
<label>Date</label><input type="date" id="fDate">
<label>Medicine Description</label><input type="text" id="fMedicine" placeholder="e.g. Paracetamol 500mg">
<label>Quantity</label><input type="number" id="fQty" placeholder="e.g. 100">
<label>Expiry Date</label><input type="date" id="fExpiry">
<label id="clinicLabel">Receiving Clinic</label>
<select id="fClinic"></select>
<label id="fromLabel" class="hidden">From Clinic (for Option 4)</label>
<select id="fFromClinic" class="hidden"></select>
<label>Transferred By</label><input type="text" id="fBy" placeholder="Your name">
<button onclick="saveTransfer()">Save Transfer</button>
<button class="grey" onclick="backMenu()">Back</button>
<p id="saveMsg"></p>
</div>
</div>

<!-- VIEW TRANSACTION -->
<div class="card hidden" id="viewBox">
<h3>View Transaction</h3>
<label>Select Number (1,2,3,4)</label>
<select id="vType">
<option value="">All</option><option value="1">1 - Natpharm to Clinics</option>
<option value="2">2 - Chitsungo to Clinics</option><option value="3">3 - Natpharm to Chitsungo</option>
<option value="4">4 - Clinic to Clinic</option>
</select>
<label>Select Clinic (if transaction involves clinic)</label>
<select id="vClinic"><option value="">All Clinics</option></select>
<label>Select Period</label>
<select id="vPeriod">
<option value="">All Time</option><option value="day">Day</option>
<option value="week">Week</option><option value="month">Month</option><option value="year">Year</option>
</select>
<label>Pick Date for Period</label><input type="date" id="vDate">
<button onclick="loadTransactions()">View Transactions</button>
<button class="grey" onclick="backMenu()">Back</button>
<div id="viewResult"></div>
</div>

<!-- SUMMARY -->
<div class="card hidden" id="summaryBox">
<h3>Summarised Data</h3>
<label>Select Number (1,2,3,4)</label>
<select id="sType">
<option value="">All</option><option value="1">1 - Natpharm to Clinics</option>
<option value="2">2 - Chitsungo to Clinics</option><option value="3">3 - Natpharm to Chitsungo</option>
<option value="4">4 - Clinic to Clinic</option>
</select>
<label>Select Clinic</label>
<select id="sClinic"><option value="">All Clinics</option></select>
<label>Select Time</label>
<select id="sPeriod">
<option value="">All Time</option><option value="day">Day</option>
<option value="week">Week</option><option value="month">Month</option><option value="year">Year</option>
</select>
<label>Pick Date for Period</label><input type="date" id="sDate">
<button onclick="loadSummary()">Show Summary</button>
<button class="grey" onclick="backMenu()">Back</button>
<div id="summaryResult"></div>
</div>

<script>
const SUPABASE_URL = "PASTE_YOUR_URL_HERE";
const SUPABASE_KEY = "PASTE_YOUR_KEY_HERE";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const clinics = ["Mushumbi","Mahuwe","Nyambudzi","Chikafa","Chapoto","Angwa","Masoka","Chirunya","Masomo","Musengezi","Chidodo","Gonono","Mariga","Kadizibonga"];
let currentType = 0;

function fillClinics(){
  let opts = clinics.map(c=>`<option value="${c}">${c}</option>`).join("");
  document.getElementById('fClinic').innerHTML = opts;
  document.getElementById('fFromClinic').innerHTML = opts;
  document.getElementById('vClinic').innerHTML = `<option value="">All Clinics</option>` + opts;
  document.getElementById('sClinic').innerHTML = `<option value="">All Clinics</option>` + opts;
}
fillClinics();

function hideAll(){ ['enterBox','viewBox','summaryBox'].forEach(id=>document.getElementById(id).classList.add('hidden')); }
function backMenu(){ hideAll(); document.getElementById('menu').classList.remove('hidden'); }
function showEnter(){ hideAll(); document.getElementById('enterBox').classList.remove('hidden'); }
function showView(){ hideAll(); document.getElementById('viewBox').classList.remove('hidden'); }
function showSummary(){ hideAll(); document.getElementById('summaryBox').classList.remove('hidden'); }

function selectType(n){
  currentType = n;
  const names = {1:"1 - Natpharm to Clinics",2:"2 - Chitsungo to Clinics",3:"3 - Natpharm to Chitsungo",4:"4 - Clinic to Clinic"};
  document.getElementById('selectedType').innerText = "Selected: " + names[n];
  document.getElementById('formBox').classList.remove('hidden');
  const clinicSel = document.getElementById('fClinic');
  const fromSel = document.getElementById('fFromClinic');
  const fromLabel = document.getElementById('fromLabel');
  if(n===3){ // Natpharm to Chitsungo - receiving is Chitsungo
    clinicSel.innerHTML = `<option value="Chitsungo">Chitsungo</option>`;
    fromSel.classList.add('hidden'); fromLabel.classList.add('hidden');
    document.getElementById('clinicLabel').innerText = "Receiving - Chitsungo Hospital";
  } else if(n===4){
    clinicSel.innerHTML = clinics.map(c=>`<option value="${c}">${c}</option>`).join("");
    fromSel.classList.remove('hidden'); fromLabel.classList.remove('hidden');
    document.getElementById('clinicLabel').innerText = "Receiving Clinic (To)";
  } else {
    clinicSel.innerHTML = clinics.map(c=>`<option value="${c}">${c}</option>`).join("");
    fromSel.classList.add('hidden'); fromLabel.classList.add('hidden');
    document.getElementById('clinicLabel').innerText = "Receiving Clinic";
  }
}

async function saveTransfer(){
  const date = document.getElementById('fDate').value;
  const med = document.getElementById('fMedicine').value.trim();
  const qty = parseInt(document.getElementById('fQty').value);
  const expiry = document.getElementById('fExpiry').value;
  let clinic = document.getElementById('fClinic').value;
  const by = document.getElementById('fBy').value.trim();
  if(currentType===4){
    const fromC = document.getElementById('fFromClinic').value;
    clinic = fromC + " ->" + clinic; // store as "Mahuwe -> Mushumbi" so we still use 6 columns
  }
  if(!currentType || !date || !med || !qty || !expiry || !clinic || !by){
    document.getElementById('saveMsg').innerText = "Please fill ALL fields and select option 1,2,3,4 first!";
    return;
  }
  const {error} = await supabaseClient.from('medicine_transfers').insert([{
    transfer_type: currentType,
    transfer_date: date,
    medicine_description: med,
    quantity: qty,
    expiry_date: expiry,
    receiving_clinic: clinic,
    transferred_by: by
  }]);
  if(error){ document.getElementById('saveMsg').innerText = "Error: " + error.message; }
  else{
    document.getElementById('saveMsg').innerText = "Saved! Transfer added to database.";
    document.getElementById('fMedicine').value=""; document.getElementById('fQty').value="";
  }
}

function getRange(period, dateStr){
  if(!period || !dateStr) return null;
  let d = new Date(dateStr); let start = new Date(d); let end = new Date(d);
  if(period==="day"){ start.setHours(0,0,0,0); end.setHours(23,59,59,999); }
  if(period==="week"){ let day = d.getDay(); start.setDate(d.getDate()-day); start.setHours(0,0,0,0); end = new Date(start); end.setDate(start.getDate()+6); end.setHours(23,59,59,999); }
  if(period==="month"){ start = new Date(d.getFullYear(), d.getMonth(), 1); end = new Date(d.getFullYear(), d.getMonth()+1, 0, 23,59,59,999); }
  if(period==="year"){ start = new Date(d.getFullYear(),0,1); end = new Date(d.getFullYear(),11,31,23,59,59,999); }
  return {start: start.toISOString().slice(0,10), end: end.toISOString().slice(0,10)};
}

async function loadTransactions(){
  let q = supabaseClient.from('medicine_transfers').select('*').order('transfer_date',{ascending:false});
  const t = document.getElementById('vType').value;
  const c = document.getElementById('vClinic').value;
  const p = document.getElementById('vPeriod').value;
  const dt = document.getElementById('vDate').value;
  if(t) q = q.eq('transfer_type', parseInt(t));
  if(c) q = q.ilike('receiving_clinic', '%'+c+'%');
  const r = getRange(p, dt);
  if(r){ q = q.gte('transfer_date', r.start).lte('transfer_date', r.end); }
  const {data, error} = await q;
  if(error){ document.getElementById('viewResult').innerHTML = "Error: "+error.message; return; }
  if(!data.length){ document.getElementById('viewResult').innerHTML = "<p>No transactions found.</p>"; return; }
  let html = `<p><b>${data.length} transactions found</b></p><table><tr><th>Date</th><th>Medicine</th><th>Qty</th><th>Expiry</th><th>Receiving</th><th>By</th><th>Type</th></tr>`;
  data.forEach(row=>{ html += `<tr><td>${row.transfer_date}</td><td>${row.medicine_description}</td><td>${row.quantity}</td><td>${row.expiry_date}</td><td>${row.receiving_clinic}</td><td>${row.transferred_by}</td><td>${row.transfer_type}</td></tr>`; });
  html += `</table>`;
  document.getElementById('viewResult').innerHTML = html;
}

async function loadSummary(){
  let q = supabaseClient.from('medicine_transfers').select('*');
  const t = document.getElementById('sType').value;
  const c = document.getElementById('sClinic').value;
  const p = document.getElementById('sPeriod').value;
  const dt = document.getElementById('sDate').value;
  if(t) q = q.eq('transfer_type', parseInt(t));
  if(c) q = q.ilike('receiving_clinic', '%'+c+'%');
  const r = getRange(p, dt);
  if(r){ q = q.gte('transfer_date', r.start).lte('transfer_date', r.end); }
  const {data, error} = await q;
  if(error){ document.getElementById('summaryResult').innerHTML = "Error: "+error.message; return; }
  if(!data.length){ document.getElementById('summaryResult').innerHTML = "<p>No data for this summary.</p>"; return; }
  // Group by medicine
  let totals = {};
  data.forEach(row=>{ totals[row.medicine_description] = (totals[row.medicine_description]||0) + row.quantity; });
  let html = `<p><b>Total Transfers: ${data.length} | Total Quantity: ${data.reduce((a,b)=>a+b.quantity,0)}</b></p><table><tr><th>Medicine</th><th>Total Quantity</th></tr>`;
  for(let med in totals){ html += `<tr><td>${med}</td><td>${totals[med]}</td></tr>`; }
  html += `</table>`;
  document.getElementById('summaryResult').innerHTML = html;
}
</script>
</body>
</html>
